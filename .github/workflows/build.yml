name: Build Corange APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:stable
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Corange-Bomberman-APK
          path: bin/*.apk
