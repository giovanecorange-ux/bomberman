name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install --upgrade https://github.com/kivy/buildozer/archive/master.zip
          pip install --upgrade https://github.com/kivy/python-for-android/archive/master.zip
          pip install cython==0.29.36
          yes | sdkmanager --licenses
          sdkmanager "build-tools;33.0.1" "platforms;android-33" "platform-tools" "ndk;25.1.8937393"
          rm -rf ~/.buildozer

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: corangevideogame-arm64-v8a-debug
          path: bin/*.apk
