name: Build Pacman APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses6 cmake libffi-dev libssl-dev
          pip install --upgrade pip setuptools
          pip install buildozer==1.5.0 Cython==0.29.36

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pacman-apk
          path: bin/*.apk
