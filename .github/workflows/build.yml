name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10.13'

      - name: Install System Deps
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip build-essential libssl-dev libffi-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Accept Licenses and Fix sdkmanager path
        run: |
          mkdir -p ~/.android/licenses $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license
          echo "24333f8a4f4113a41c683d0e53a7b40b10879d86" >> ~/.android/licenses/android-sdk-license
          cp ~/.android/licenses/android-sdk-license $ANDROID_HOME/licenses/
          # CORREÇÃO DO BUG QUE TÁ NO TEU VIDEO:
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager || true
          touch ~/.android/repositories.cfg

      - name: Build APK
        run: buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman-APK
          path: bin/*.apk
