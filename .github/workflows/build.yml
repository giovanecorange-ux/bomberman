name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9.22'

      - name: Install Buildozer
        run: |
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install cython==0.29.36

      - name: Accept ALL Licenses
        run: |
          echo "Criando licenças em todos os lugares..."
          for dir in ~/.android/licenses ~/.buildozer/android/platform/android-sdk/licenses $ANDROID_HOME/licenses $ANDROID_SDK_ROOT/licenses; do
            mkdir -p $dir
            echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $dir/android-sdk-license
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $dir/android-sdk-license
            echo "24333f8a4f4113a41c683d0e53a7b40b10879d86" >> $dir/android-sdk-license
            echo "y" > $dir/android-sdk-preview-license
            echo "Criado em $dir"
          done
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman-APK
          path: bin/*.apk
