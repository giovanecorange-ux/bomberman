      - name: Build APK
        run: |
          mkdir -p ~/.android/licenses $ANDROID_HOME/licenses ~/.buildozer/android/platform/android-sdk/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a4f4113a41c683d0e53a7b40b10879d86\n" > ~/.android/licenses/android-sdk-license
          cp ~/.android/licenses/android-sdk-license $ANDROID_HOME/licenses/
          cp ~/.android/licenses/android-sdk-license ~/.buildozer/android/platform/android-sdk/licenses/ || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          touch ~/.android/repositories.cfg

          echo "=== PRIMEIRA TENTATIVA - VAI QUEBRAR MESMO ==="
          buildozer android debug --verbose || true

          echo "=== AGORA O SDK DO BUILDOSER JÁ EXISTE, VAMOS CONSERTAR ==="
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK/licenses $SDK/tools/bin $SDK/cmdline-tools/latest/bin
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a4f4113a41c683d0e53a7b40b10879d86\n" > $SDK/licenses/android-sdk-license
          
          # acha o sdkmanager que o buildozer baixou
          REAL_SDKMANAGER=$(find $SDK -name sdkmanager -type f | head -n 1)
          echo "sdkmanager encontrado em: $REAL_SDKMANAGER"
          
          if [ -f "$REAL_SDKMANAGER" ]; then
            yes | $REAL_SDKMANAGER --licenses || true
            $REAL_SDKMANAGER "build-tools;27.0.3" "build-tools;33.0.2" "platform-tools" || true
            ln -sf $REAL_SDKMANAGER $SDK/tools/bin/sdkmanager || true
            ln -sf $REAL_SDKMANAGER $SDK/cmdline-tools/latest/bin/sdkmanager || true
          fi
          
          # instala na mão o aidl/aapt que tá faltando no teu video
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;27.0.3" || true
          mkdir -p $SDK/build-tools/
          cp -r $ANDROID_HOME/build-tools/27.0.3 $SDK/build-tools/ || true
          cp -r $ANDROID_HOME/build-tools/33.0.2 $SDK/build-tools/ || true

          echo "=== SEGUNDA TENTATIVA - AGORA VAI ==="
          buildozer android debug --verbose
