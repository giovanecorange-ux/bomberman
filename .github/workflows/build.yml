name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10.13'

      - name: Install System Deps
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-dev build-essential libssl-dev libffi-dev \
          libncurses5 libncurses5-dev zlib1g-dev libbz2-dev libsqlite3-dev \
          libltdl-dev zip unzip autoconf automake libtool

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Accept Licenses
        run: |
          mkdir -p ~/.android/licenses ~/.buildozer/android/platform/android-sdk/licenses $ANDROID_HOME/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a4f4113a41c683d0e53a7b40b10879d86\n" > ~/.android/licenses/android-sdk-license
          cp ~/.android/licenses/android-sdk-license ~/.buildozer/android/platform/android-sdk/licenses/
          cp ~/.android/licenses/android-sdk-license $ANDROID_HOME/licenses/
          touch ~/.android/repositories.cfg

      - name: Build APK
        run: |
          buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman-APK
          path: bin/*.apk
